baseURL = "https://testkitchen.luischav.es/"
languageCode = "en"
title = "Instagram Recipe Explorer"

[params]
  description = "A searchable collection of saved Instagram recipes"

[taxonomies]
  quality = "qualities"
  author = "authors"

[outputs]
  home = ["HTML"]

# Raw HTML in markdown stays disabled: recipe bodies come from Instagram
# captions, so rendering caption HTML unsanitized would be an XSS vector.
[markup.goldmark.renderer]
  unsafe = false
